# 依存ライブラリと GitHub Actions の更新を週 1 回提案してもらう
version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    groups:
      androidx:
        patterns: ["androidx.*", "com.google.android.material*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
