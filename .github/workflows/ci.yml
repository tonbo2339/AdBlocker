# push と pull request のたびに、単体テスト・lint・デバッグビルドを実行する。
# リリース用の署名鍵はここでは使わない (リリースは手元で署名する)
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Unit tests, lint and debug build
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: app/build/reports/
      - name: Release build without a signing key must fail
        run: |
          set +e
          log=$(./gradlew assembleRelease --no-daemon 2>&1)
          code=$?
          echo "$log" | tail -15
          if [ "$code" -eq 0 ] || ! echo "$log" | grep -q "署名の設定"; then
            echo "::error::署名の鍵が無いのに、リリースビルドが失敗になっていません (app/build.gradle.kts の releaseSigning を確かめてください)"
            exit 1
          fi
